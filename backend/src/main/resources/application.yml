server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  config:
    import: optional:file:./local-secrets.yml,optional:file:../local-secrets.yml
  application:
    name: yinbo-agent-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/yinbo_agent}
    username: ${POSTGRES_USERNAME:}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    redis:
      namespace: yinbo:agent:session
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${INGESTION_MAX_FILE_SIZE:200MB}
      max-request-size: ${INGESTION_MAX_REQUEST_SIZE:220MB}
  ai:
    mcp:
      server:
        name: yinbo-agent-mcp
        version: 0.0.1
        protocol: STREAMABLE

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: yinbo-agent-producer

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
    info:
      access: read-only
    env:
      show-values: never
    configprops:
      show-values: never

logging:
  file:
    name: .logs/service.log
  logback:
    rollingpolicy:
      file-name-pattern: .logs/service.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: false
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] app=${spring.application.name} requestId=%X{requestId:-} logger=%logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] app=${spring.application.name} requestId=%X{requestId:-} logger=%logger{36} - %msg%n"

app:
  logging:
    slow-request-threshold-ms: ${APP_SLOW_REQUEST_THRESHOLD_MS:3000}
  concurrency:
    upload:
      max-permits: ${UPLOAD_MAX_CONCURRENCY:10}
      lease-ttl: ${UPLOAD_CONCURRENCY_LEASE_TTL:10m}
    ingestion:
      max-permits: ${INGESTION_MAX_CONCURRENCY:5}
      lease-ttl: ${INGESTION_CONCURRENCY_LEASE_TTL:30m}
  ai-infra:
    base-url: ${YINBO_AI_INFRA_URI:http://localhost:8082}
    request-timeout: ${AI_INFRA_REQUEST_TIMEOUT:5m}
  ai:
    rag:
      embedding-model: ${RAG_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}
      reranker-model: ${RAG_RERANKER_MODEL:Qwen/Qwen3-Reranker-8B}
      embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
      vector-index-type: ${RAG_VECTOR_INDEX_TYPE:HNSW}
      vector-table-name: ${RAG_VECTOR_TABLE_NAME:knowledge_chunk_vector}
      default-chunk-size: ${RAG_DEFAULT_CHUNK_SIZE:1000}
      default-chunk-overlap: ${RAG_DEFAULT_CHUNK_OVERLAP:150}
      default-max-chunks: ${RAG_DEFAULT_MAX_CHUNKS:200}
      min-chunk-size: ${RAG_MIN_CHUNK_SIZE:80}
      max-source-bytes: ${RAG_MAX_SOURCE_BYTES:209715200}
      ingestion-topic: ${RAG_INGESTION_TOPIC:rag-ingestion-task}
      ingestion-consumer-group: ${RAG_INGESTION_CONSUMER_GROUP:yinbo-agent-ingestion-consumer}
  auth:
    seed-admin-username: ${AUTH_SEED_ADMIN_USERNAME:}
    seed-admin-password: ${AUTH_SEED_ADMIN_PASSWORD:}
  storage:
    provider: ${OBJECT_STORAGE_PROVIDER:rustfs}
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
    bucket: ${RUSTFS_BUCKET:yinbo-agent-documents}
