server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  config:
    import: optional:file:./local-secrets.yml,optional:file:../local-secrets.yml
  application:
    name: yinbo-agent-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/yinbo_agent}
    username: ${POSTGRES_USERNAME:}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    redis:
      namespace: yinbo:agent:session
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${INGESTION_MAX_FILE_SIZE:50MB}
      max-request-size: ${INGESTION_MAX_REQUEST_SIZE:100MB}
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.siliconflow.cn}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:deepseek-ai/DeepSeek-V4-Flash}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}
          dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    mcp:
      server:
        name: yinbo-agent-mcp
        version: 0.0.1
        protocol: STREAMABLE

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: yinbo-agent-producer

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    rag:
      embedding-model: ${RAG_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}
      reranker-model: ${RAG_RERANKER_MODEL:Qwen/Qwen3-Reranker-8B}
      embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
      vector-index-type: ${RAG_VECTOR_INDEX_TYPE:HNSW}
      vector-table-name: ${RAG_VECTOR_TABLE_NAME:knowledge_chunk_vector}
      default-chunk-size: ${RAG_DEFAULT_CHUNK_SIZE:1000}
      default-chunk-overlap: ${RAG_DEFAULT_CHUNK_OVERLAP:150}
      default-max-chunks: ${RAG_DEFAULT_MAX_CHUNKS:200}
      min-chunk-size: ${RAG_MIN_CHUNK_SIZE:80}
      max-source-bytes: ${RAG_MAX_SOURCE_BYTES:52428800}
      ingestion-topic: ${RAG_INGESTION_TOPIC:rag-ingestion-task}
      ingestion-consumer-group: ${RAG_INGESTION_CONSUMER_GROUP:yinbo-agent-ingestion-consumer}
    models:
      - id: deepseek-ai/DeepSeek-V4-Flash
        name: DeepSeek V4 Flash
        provider: siliconflow
        enabled: true
      - id: Pro/moonshotai/Kimi-K2.6
        name: Kimi K2.6 Pro
        provider: siliconflow
        enabled: true
      - id: Pro/zai-org/GLM-5.1
        name: GLM 5.1 Pro
        provider: siliconflow
        enabled: true
      - id: Pro/MiniMaxAI/MiniMax-M2.5
        name: MiniMax M2.5 Pro
        provider: siliconflow
        enabled: true
      - id: Qwen/Qwen3.6-27B
        name: Qwen3.6 27B
        provider: siliconflow
        enabled: true
  auth:
    seed-admin-username: ${AUTH_SEED_ADMIN_USERNAME:}
    seed-admin-password: ${AUTH_SEED_ADMIN_PASSWORD:}
  storage:
    provider: ${OBJECT_STORAGE_PROVIDER:rustfs}
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
    bucket: ${RUSTFS_BUCKET:yinbo-agent-documents}
