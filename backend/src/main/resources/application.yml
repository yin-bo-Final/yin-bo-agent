server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  config:
    import: optional:file:./local-secrets.yml,optional:file:../local-secrets.yml
  application:
    name: yinbo-agent-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/yinbo_agent}
    username: ${POSTGRES_USERNAME:}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    redis:
      namespace: yinbo:agent:session
  sql:
    init:
      mode: always
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.siliconflow.cn}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:deepseek-ai/DeepSeek-V4-Flash}
    mcp:
      server:
        name: yinbo-agent-mcp
        version: 0.0.1
        protocol: STREAMABLE

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: yinbo-agent-producer

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    models:
      - id: deepseek-ai/DeepSeek-V4-Flash
        name: DeepSeek V4 Flash
        provider: siliconflow
        enabled: true
      - id: Pro/moonshotai/Kimi-K2.6
        name: Kimi K2.6 Pro
        provider: siliconflow
        enabled: true
      - id: Pro/zai-org/GLM-5.1
        name: GLM 5.1 Pro
        provider: siliconflow
        enabled: true
      - id: Pro/MiniMaxAI/MiniMax-M2.5
        name: MiniMax M2.5 Pro
        provider: siliconflow
        enabled: true
      - id: Qwen/Qwen3.6-27B
        name: Qwen3.6 27B
        provider: siliconflow
        enabled: true
  auth:
    seed-admin-username: ${AUTH_SEED_ADMIN_USERNAME:}
    seed-admin-password: ${AUTH_SEED_ADMIN_PASSWORD:}
