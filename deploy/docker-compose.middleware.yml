services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yinbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yinbo_agent}
      POSTGRES_USER: ${POSTGRES_USERNAME:-yinbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - yinbo-middleware

  redis:
    image: redis:7.4-alpine
    container_name: yinbo-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - yinbo-middleware

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: yinbo-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    networks:
      - yinbo-middleware

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: yinbo-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker --enable-proxy -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10912:10912"
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq_broker_store:/home/rocketmq/store
      - rocketmq_broker_logs:/home/rocketmq/logs
    networks:
      - yinbo-middleware

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: yinbo-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18082:8080"
    networks:
      - yinbo-middleware

  rustfs:
    image: rustfs/rustfs:latest
    container_name: yinbo-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: "/data/rustfs{0..3}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - yinbo-middleware

networks:
  yinbo-middleware:
    name: yinbo-middleware
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_store:
  rocketmq_broker_logs:
  rustfs_data:
